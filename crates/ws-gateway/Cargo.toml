[package]
name    = "ws-gateway"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Horizon TAP v2 (GraphTally) WebSocket data service. Custom WS relay + per-endpoint pricing on horizon-core."

[[bin]]
name = "ws-gateway"
path = "src/main.rs"

[dependencies]
horizon-core = { git = "https://github.com/nuthatch-org/horizon-core", branch = "main" }

# WebSocket relay (the service-specific part horizon-core's HTTP proxy can't cover)
axum              = { version = "0.8", features = ["macros", "ws"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util      = "0.3"

# Config / serialization
serde = { version = "1", features = ["derive"] }
toml  = "0.8"

# Runtime / utils
tokio              = { version = "1", features = ["full"] }
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy            = "0.15"
